[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "PostgreSQL"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
log = "=0.4.35"
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "=2.10.1"
tauri-plugin-shell = "=2.6.0"
tauri-plugin-dialog = "=2.8.4"
sha2 = "=0.11.1"
base64 = "=0.23.1"
x509-parser = "=0.18.1"
tauri-plugin-wdio = { version = "=1.5.1", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-single-instance = "=2.5.5"

# Instrumented build for the native E2E only (REQ-TEST-08). The product never enables it.
[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
